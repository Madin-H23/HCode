name: Desktop CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  desktop:
    name: Desktop (typecheck + unit + e2e)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # desktop 的类型检查透读根目录 src/（Harness 源码），需先装根依赖
      - name: Install harness dependencies (repo root)
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (bridge + chat reducer + session index, mock model)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E smoke (Playwright Electron, mock model, isolated data home)
        run: npx playwright test
